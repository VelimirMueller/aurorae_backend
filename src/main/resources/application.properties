# configure the Quinoa dev server and allow spa routing
quarkus.quinoa.dev-server.port=3000
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true

# configure your datasource
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = ${DB_USERNAME:pgsql_admin}
# no committed credential — set DB_PASSWORD in the environment or a local .env (see .env.example); empty default so tests/CI boot without a DB
quarkus.datasource.password = ${DB_PASSWORD:}
quarkus.datasource.jdbc.url = ${DB_URL:jdbc:postgresql://localhost:5432/aurorae}

# drop and create the database at startup (use `update` to only update the schema)
quarkus.hibernate-orm.database.generation = drop-and-create